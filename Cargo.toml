[package]
name = "tenant-kv"
version = "0.10.1"
edition = "2024"
rust-version = "1.99.1"
description = "Tenant-isolated Rust document and lookup engine with a native LSM"
license = "Apache-2.0"

[features]
failpoints = []

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
axum = "=0.8.9"
hyper = { version = "=1.12.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio", "service"] }
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["arbitrary_precision"] }
uuid = { version = "=1.28.0", features = ["v4", "serde"] }
parking_lot = "=0.12.5"
fs2 = "0.4.3"
libc = "0.2"
crc32fast = "=1.5.0"
lz4_flex = "0.11.5"
sha2 = "=0.10.9"
opendal = { version = "=0.55.0", features = ["services-s3", "services-fs", "blocking"] }
base64 = "=0.22.1"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
http-body-util = "0.1.3"
opentelemetry = { version = "=0.31.0", default-features = false, features = ["trace", "logs"] }
opentelemetry_sdk = { version = "=0.31.0", default-features = false, features = ["trace", "logs"] }
opentelemetry-otlp = { version = "=0.31.1", default-features = false, features = ["trace", "logs", "http-json", "reqwest-blocking-client", "reqwest-rustls"] }

[dev-dependencies]
tempfile = "=3.27.0"
tower = { version = "=0.5.3", features = ["util"] }
http-body-util = "0.1.3"

[profile.release]
lto = "thin"
codegen-units = 1

[[bin]]
name = "tenant-kv"
path = "src/bin/server.rs"

[[bin]]
name = "crash-probe"
path = "src/bin/crash_probe.rs"
required-features = ["failpoints"]

[[bin]]
name = "tenant-kv-restore"
path = "src/bin/restore_remote.rs"


[[bin]]
name = "tenant-kv-repair"
path = "src/bin/repair.rs"
